name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please focus on the user problem and the expected outcome.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What friction, limitation, or use case are you trying to address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Examples, sketches, links, or constraints.
