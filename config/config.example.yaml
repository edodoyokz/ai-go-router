server:
  host: 127.0.0.1
  port: 1988
  api_key: admin
  request_timeout_seconds: 60
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  idle_timeout_seconds: 120
  read_header_timeout_seconds: 10
  max_header_bytes: 1048576
  cors:
    allowed_origins: []  # Empty = CORS disabled. Example: ["https://example.com", "https://app.example.com"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type"]
    allow_credentials: false
    max_age_seconds: 86400  # 24 hours

logging:
  level: info
  json_mode: false
  retention_days: 14

storage:
  sqlite_path: ./data/router.db

retry:
  max_attempts: 3
  initial_backoff_ms: 100
  max_backoff_ms: 2000
  max_cooldown_ms: 300000
  circuit_breaker:
    failure_threshold: 5
    open_timeout_ms: 300000
    success_threshold: 2

# Error classification rules (evaluated in order)
errors:
  text_rules:
    - text: rate limit
      backoff: true
    - text: too many requests
      backoff: true
    - text: quota exceeded
      backoff: true
    - text: no credentials
      cooldown_ms: 120000
  status_rules:
    - status: 429
      backoff: true
    - status: 503
      backoff: true
    - status: 401
      cooldown_ms: 120000

# Global settings
settings:
  combo_strategy: fallback        # default combo strategy: fallback or round-robin
  outbound_proxy_enabled: false
  outbound_proxy_url: ""
  native_passthrough: false       # preserve provider-native fields when supported
  locale: en
  thinking:
    enabled: false
    max_tokens: 5000
    include_reasoning: false

# Model aliases (short names -> provider/model)
model_aliases: {}

# Route/combo names win before model_aliases when names overlap.
routes: {}

# Onboarding-first: start with no providers, add from Web UI.
providers: []

